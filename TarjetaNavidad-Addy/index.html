<!-- Este desarrollo vamos a diseñar una tarjeta interactiva de navidad-->
<!--Nombre:Addy Santana-->
<!--Actividad 1-->

<!DOCTYPE html> <!-- Esta etiqueta declara el tipo de documento-->
<html lang="es">
<head>
<title> Tarjeta de Navidad | Personalizados </title>
<!--En la etiqueta head va todo lo que no es visible en la pagina web pero la  hacen funciona para el SEO-->
<!--Acontinuación los metadatos para la pagina reconozca, caracteres especiales, y se adapte a diferentes dispositivos-->
<meta charset="UTF-8"> <!-- Este metadato es para los caracteres especiales-->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tarjeta de Navidad interactiva con diseño personalizado">
  <meta name="author" content="Addy Santana">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="styles.css">

</head> <!-- HASTA AQUI VA EL HEAD-->

<!--AQUI INICIA EL body-->
<body>
    <div class="main-container">
   <!-- Cover -->
   <div class="page active" id="page-0">
    <div class="float-container">
     <img src="merry-bieber.jpg" alt="navidad justin" class="cover-img">
    </div>
    <h1 class="cover-title">FELIZ NAVIDAD 2026 🎄</h1>
    <p class="cover-subtitle">TE DESO TODO LO BONITO ¡FELICES FIESTAS!</p>
    <button id="btn-enter" class="btn-primary">
      <span class="btn-text">Entrar </span>
    </button>
   </div>
  <!--Mensaje página 1-->

<div class="page" id="pagina1">
    <div class="photo-circle">
      <img class="photo-img" loading="lazy" src="justin-bieber-2009.jpg" alt="imagen de justin">
    </div>
    <p class="msg-text">En esta navidad te deseo amor, paz y dinero ⛄</p>
    <button id="btn-next-1" class="btn-secondary">
      <span class="btn-text">Siguiente</span>
    </button>
   </div>

<!--Mensaje página 2-->

 <div class="page" id="pagina2">
    <h2 class="gallery-title">Eres especial✨</h2>
    <div class="gallery-grid">
     <div class="gallery-item gold-border">
      <img class="gallery-img" loading="lazy" src="justin-regalo.jpg" alt="justin abriendo regalo">
     </div>
     <div class="gallery-item gold-border">
      <img class="gallery-img" loading="lazy" src="navidad-2010.jpg" alt="navidad como antes">
     </div>
     <div class="gallery-item gold-border">
      <img class="gallery-img" loading="lazy" src="justin-arbol.jpg" alt="justin y un arbol">
     </div>
    </div>
  
    <p class="gallery-caption">Disfruta de cada navidad como antes, como cuando no era cantante🎁</p>
   </div>

  <!--Es un botón para revelar un mensaje-->
  
  <div class="page" id="pagina3">
    <div class="float-container float">
       <span class="heart-emoji">🎅</span>
    </div>
    <p class="msg-text">Pícale para ver tu mensaje</p>
    <button id="btn-reveal" class="btn-309ebc">
      <span class="btn-text">Descubre tu mensaje</span>
    </button>
   </div>


  <!--Mensaje Final--> 
 <div class="page" id="pagina4">
    <div id="final-card" class="final-card">
     <audio id="navidad-audio" src="audio-navidad.mp3"></audio>
     <div class="photo-circle gold-border final-photo">
      <img class="photo-img" loading="lazy" src="charlie-navidad.jpg" alt="charlie-amigos">
     </div>
     <h2 class="final-title">¡Felices Fiestas!</h2>
     <p class="final-msg">Besos, felicidad y bendiciones esta navidad!</p>
     <button id="btn-audio-ebc" class="btn-heart">
      <span id="ebc-audio-btn-text">💗</span>
     </button>
    </div>
    <div id="confetti-container" class="confetti-container"></div>
   </div>

   <!--Navegación de la tarjeta-->
  <nav class="nav-container" aria-label="Navegación de páginas">
    <button id="btn-prev" class="btn-nav" aria-label="Anterior">
      <i data-lucide="chevron-left" class="icon-nav"></i>
    </button>
    <div id="dots" class="dots-container"></div>
    <button id="btn-next" class="btn-nav" aria-label="Siguiente">
      <i data-lucide="chevron-right" class="icon-nav"></i>
    </button>
   </nav>
  </div> 

<script src="script.js"></script>
</body>
</html>
